server:
  port: "3000"
  timeout: 30000

database:
  host: "localhost"
  port: 5432
  username: "opencode"
  password: "opencode_secret"
  name: "opencode"
  sslmode: "disable"
  maxOpenConns: 100
  maxIdleConns: 10
  connMaxLifetime: 300

redis:
  host: "localhost"
  port: 6379
  password: ""
  db: 0
  poolSize: 10

oss:
  enabled: true
  endpoint: "oss-cn-hangzhou.aliyuncs.com"
  accessKeyID: "${OSS_ACCESS_KEY_ID}"
  accessKeySecret: "${OSS_ACCESS_KEY_SECRET}"
  bucket: "opencode-files"
  region: "cn-hangzhou"
  domain: ""
  presignExpiry: 3600
  maxFileSize: 104857600

auth:
  jwt:
    secret: "your-jwt-secret-key-change-in-production"
    expiry: "24h"

logging:
  level: "info"
  format: "json"
